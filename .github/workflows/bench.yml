name: bench
# Device benchmark APK (tools/diagnostics/androidBench): arm64 only, no examples project. Run it
# from the Actions page (Run workflow) and install the artifact `katsa-bench-apk`.
on:
  workflow_dispatch:
env:
  PYTHONUNBUFFERED: '1'
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: SDK and NDK (preinstalled on the runner; installs what is missing)
        run: |
          SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" "cmake;3.22.1" "ndk;26.3.11579264"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"
      - run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      - uses: gradle/actions/setup-gradle@v4
      - name: Native libraries for arm64
        run: python3 tools/native/build.py android
      - name: LuaJIT, SDL2, OpenAL Soft, game archive
        run: tools/ci/annotate.sh prepare python3 android/prepare.py --abis arm64-v8a --project tools/diagnostics/androidBench
      - name: Build the APK
        working-directory: android
        run: ../tools/ci/annotate.sh gradle ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: katsa-bench-apk
          path: android/app/build/outputs/apk/debug/*.apk
