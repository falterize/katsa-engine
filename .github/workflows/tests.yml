name: tests
on:
  workflow_dispatch:
  push:
    branches: ['v1[0-9][0-9]*']
    paths: ['source/**', 'assets/**', 'validation/**', 'tools/**', 'conf.lua', 'main.lua', '.github/**']
  pull_request:
env:
  PYTHONUNBUFFERED: '1'
jobs:
  suites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/checkout-examples
      - uses: ./.github/actions/setup-engine
      - name: Documentation book is up to date
        run: python3 tools/docs/buildBook.py --check
      - name: Regression suites
        env:
          KATSA_LIB_DIR: ${{ github.workspace }}/native/build/linux
          KATSA_PROJECT: ${{ github.workspace }}/examples
        run: tools/ci/runSuites.sh
