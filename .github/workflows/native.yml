name: native
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: linux }
          - { os: macos-latest, target: macos }
          - { os: ubuntu-latest, target: android }
          - { os: ubuntu-latest, target: windows }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (Windows cross build)
        if: matrix.target == 'windows'
        run: sudo apt-get update && sudo apt-get install -y mingw-w64
      - name: Build katsa_native
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: python3 tools/native/build.py ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: katsa-native-${{ matrix.target }}
          path: build/native/${{ matrix.target }}
