name: native
on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: ['v108*']
    paths: ['native/**', 'tools/**', 'android/**', '.github/workflows/native.yml']
  pull_request:
    paths: ['native/**', 'tools/native/**', 'tools/build/**', 'android/**', '.github/workflows/native.yml']
env:
  PYTHONUNBUFFERED: '1'
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux }
          - { os: macos-latest, target: macos }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build LuaJIT
        run: |
          git clone --depth 1 --branch v2.1 https://github.com/LuaJIT/LuaJIT.git "$RUNNER_TEMP/luajit"
          make -C "$RUNNER_TEMP/luajit" -j4 PREFIX="$HOME/lj" MACOSX_DEPLOYMENT_TARGET=11.0 install
          echo "LUAJIT_PREFIX=$HOME/lj" >> "$GITHUB_ENV"
          echo "$HOME/lj/bin" >> "$GITHUB_PATH"
      - name: Build native libraries and host
        run: tools/ci/annotate.sh build python3 tools/native/build.py ${{ matrix.target }}
      - name: System libraries for the tests
        run: |
          if [ "${{ matrix.target }}" = linux ]; then
            sudo apt-get update && sudo apt-get install -y libsdl2-2.0-0 libopenal1 xvfb libegl1 libgl1-mesa-dri
          else
            brew install sdl2 openal-soft
          fi
      - name: Unit tests
        # macOS stays non-blocking until it has passed once on a real runner.
        continue-on-error: ${{ matrix.target == 'macos' }}
        env:
          KATSA_LIB_DIR: ${{ github.workspace }}/build/native/${{ matrix.target }}
        run: |
          if [ "${{ matrix.target }}" = linux ]; then
            tools/ci/annotate.sh 'unit tests' xvfb-run -a luajit validation/tests/katsa/run.lua | tee unit.log
          else
            tools/ci/annotate.sh 'unit tests' luajit validation/tests/katsa/run.lua | tee unit.log
          fi
          test "${PIPESTATUS[0]}" = 0
      - name: Show failures
        if: always()
        run: grep -E "^(FAIL|SKIP|katsa:)" unit.log || true
      - name: Package a fused executable
        run: tools/ci/annotate.sh packaging python3 tools/build/packageProject.py --output dist --host build/native/${{ matrix.target }}/katsa
      - name: Collect
        run: |
          mkdir -p out
          cp -R build/native/${{ matrix.target }}/. out/
          cp dist/Katsa-* out/
      - uses: actions/upload-artifact@v4
        with:
          name: katsa-${{ matrix.target }}
          path: out

  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y mingw-w64
      - run: python3 tools/native/build.py windows
      - uses: actions/upload-artifact@v4
        with:
          name: katsa-native-windows
          path: build/native/windows

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Native libraries for every ABI
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: python3 tools/native/build.py android
      - uses: actions/upload-artifact@v4
        with:
          name: katsa-native-android
          path: build/native/android

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: SDK and NDK (preinstalled on the runner; installs what is missing)
        run: |
          SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" "cmake;3.22.1" "ndk;26.3.11579264"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"
      - run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: LuaJIT, SDL2, OpenAL Soft, katsa libraries, game archive
        run: tools/ci/annotate.sh prepare python3 android/prepare.py --abis arm64-v8a,x86_64
      - name: Build the APK
        working-directory: android
        run: ../tools/ci/annotate.sh gradle gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: katsa-android-apk
          path: android/app/build/outputs/apk/debug/*.apk
